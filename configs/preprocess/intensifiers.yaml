# Romanian intensifiers -> weight multiplier applied to the following
# content word's emotion-lexicon vote (preprocess/objectives.md Phase 6:
# "Implement intensifier scope"). Keys are lemma text (lowercase); a
# space-joined key matches the two preceding tokens' lemmas together (for
# "extrem de", "atât de", etc.), checked before the single-token match.
extrem de: 1.8
incredibil de: 1.8
atât de: 1.6
foarte: 1.6
absolut: 1.5
total: 1.5
foarte tare: 1.5
teribil de: 1.7
tare: 1.4
complet: 1.4
super: 1.4    # colloquial, common in datasets/hria (e.g. "super enervat")
mult: 1.3
chiar: 1.3
